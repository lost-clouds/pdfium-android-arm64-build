name: Build LlamaParse PDFium Android ARM64

on:
  workflow_dispatch:
    inputs:
      pdfium_branch:
        description: PDFium source branch to build
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build-android-arm64:
    name: Build PDFium for Android arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEPOT_TOOLS_UPDATE: "0"
      PDFIUM_BRANCH: ${{ inputs.pdfium_branch }}

    steps:
      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          echo "Disk before cleanup:"
          df -h /

          # The build downloads its own Android NDK, so the preinstalled SDK
          # and unrelated language toolchains can be removed safely.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL

          echo "Disk after cleanup:"
          df -h /

          available_kb=$(df --output=avail -k / | tail -n 1 | tr -d ' ')
          if (( available_kb < 26214400 )); then
            echo "ERROR: less than 25 GiB free on runner; PDFium checkout/build may run out of disk." >&2
            exit 1
          fi

      - name: Check external source access
        shell: bash
        run: |
          set -euxo pipefail
          git ls-remote https://chromium.googlesource.com/chromium/tools/depot_tools.git HEAD
          git ls-remote https://pdfium.googlesource.com/pdfium.git HEAD
          curl -fIL --retry 2 --connect-timeout 20 --max-time 90 \
            https://dl.google.com/android/repository/android-ndk-r25c-linux.zip

      - name: Fetch LlamaParse PDFium build scripts
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch llamaparse \
            https://github.com/run-llama/pdfium-binaries.git pdfium-binaries
          echo "Build scripts commit: $(git -C pdfium-binaries rev-parse HEAD)" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Limit Ninja parallelism
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pdfium-binaries/steps/06-build.sh")
          text = path.read_text()
          old = 'ninja -C "$BUILD_DIR" pdfium'
          new = 'ninja -j2 -C "$BUILD_DIR" pdfium'
          if old not in text:
              raise SystemExit(f"Expected Ninja command not found in {path}; inspect upstream script changes")
          path.write_text(text.replace(old, new, 1))
          PY
          grep -n ninja pdfium-binaries/steps/06-build.sh

      - name: Adapt public-header patch to current PDFium main
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          repo = Path("pdfium-binaries")
          patch_file = repo / "patches/public_headers.patch"
          patch_text = patch_file.read_text()

          # PDFium main added public/fpdf_ppo.h in November 2026. That makes
          # the older whole-file fpdf_deleters.h hunk fail. Rewrite includes
          # generically after checkout and keep the other patch hunks.
          start = patch_text.find("diff --git a/public/cpp/fpdf_deleters.h ")
          end = patch_text.find("diff --git a/public/cpp/fpdf_scopers.h ", start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("Could not isolate fpdf_deleters.h diff in public_headers.patch")
          patch_file.write_text(patch_text[:start] + patch_text[end:])

          patch_script = repo / "steps/03-patch.sh"
          script_text = patch_script.read_text()
          needle = 'apply_patch "$PATCHES/public_headers.patch"'
          if script_text.count(needle) != 1:
              raise SystemExit("Expected exactly one public_headers.patch application")

          replacement_lines = [
              "# Convert all public API includes in fpdf_deleters.h to paths relative to public/cpp.",
              "# This also handles headers added by newer PDFium main.",
              "python3 - <<'PYTHON'",
              "from pathlib import Path",
              "import re",
              "header = Path('public/cpp/fpdf_deleters.h')",
              "content = header.read_text()",
              "content, count = re.subn(",
              "    r'(?m)^(\\s*#include\\s+)\"public/([^\"]+)\"',",
              "    r'\\1\"../\\2\"',",
              "    content,",
              ")",
              "if count < 9:",
              "    raise SystemExit(f'Expected at least 9 public includes; rewrote {count}')",
              "header.write_text(content)",
              "print(f'Rewrote {count} public includes in {header}')",
              "PYTHON",
              'apply_patch "$PATCHES/public_headers.patch"',
          ]
          replacement = "\n".join(replacement_lines)
          patch_script.write_text(script_text.replace(needle, replacement, 1))
          print("Updated public-header patch compatibility handling")

          # gclient sync may finish before depot_tools has installed its
          # hermetic Python/CIPD bootstrap. GN's depot_tools wrapper requires
          # python3_bin_reldir.txt, so bootstrap explicitly before `gn gen`.
          configure = repo / "steps/05-configure.sh"
          configure_text = configure.read_text()
          marker = 'gn gen "$BUILD"'
          if configure_text.count(marker) != 1:
              raise SystemExit("Expected exactly one gn gen invocation in steps/05-configure.sh")
          bootstrap = """DEPOT_TOOLS_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")/../depot_tools\" && pwd)\"
          if [ ! -s \"$DEPOT_TOOLS_DIR/python3_bin_reldir.txt\" ]; then
            echo \"Bootstrapping depot_tools Python/CIPD tools...\"
            \"$DEPOT_TOOLS_DIR/ensure_bootstrap\"
          fi
          if [ ! -s \"$DEPOT_TOOLS_DIR/python3_bin_reldir.txt\" ]; then
            echo \"ERROR: depot_tools bootstrap did not create python3_bin_reldir.txt\" >&2
            exit 1
          fi
          """
          configure.write_text(configure_text.replace(marker, bootstrap + marker, 1))
          print("Added explicit depot_tools bootstrap before GN generation")
          PY

      - name: Build Android ARM64 PDFium
        shell: bash
        run: |
          set -euxo pipefail
          cd pdfium-binaries
          ./build.sh -b "$PDFIUM_BRANCH" android arm64

      - name: Verify library and LlamaParse symbols
        shell: bash
        run: |
          set -euo pipefail
          cd pdfium-binaries

          LIB="staging/lib/libpdfium.so"
          LLVM_NM="pdfium/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          test -s "$LIB"
          test -x "$LLVM_NM"

          "$LLVM_NM" -D --defined-only "$LIB" | awk '{print $NF}' > /tmp/pdfium.exports

          required_symbols=(
            FPDFAnnot_GetObjNum
            FPDFFont_GetCharGlyphIndex
            FPDFFont_GetCharGlyphName
            FPDFFont_GetEncoding
            FPDFFont_GetGlyphPathFromCharCode
            FPDFFont_GetGlyphWidthFromCharCode
            FPDFFont_GetType
            FPDFFont_HasToUnicode
            FPDFText_GetCharCode
            FPDF_StructElement_GetChildObjNum
          )

          failed=0
          for symbol in "${required_symbols[@]}"; do
            if grep -Fxq "$symbol" /tmp/pdfium.exports; then
              echo "[OK] $symbol"
            else
              echo "[MISSING] $symbol" >&2
              failed=1
            fi
          done
          if (( failed != 0 )); then
            echo "PDFium was built, but one or more required LiteParse symbols are missing." >&2
            exit 1
          fi

          file "$LIB"
          if ! readelf -h "$LIB" | grep -q 'Machine:.*AArch64'; then
            echo "ERROR: output is not an AArch64 ELF library" >&2
            exit 1
          fi
          readelf -h "$LIB" | grep -E 'Class:|Machine:'
          sha256sum "$LIB"

          {
            echo "## PDFium Android ARM64 build"
            echo "- PDFium source branch: $PDFIUM_BRANCH"
            echo "- LlamaParse build scripts commit: $(git rev-parse HEAD)"
            echo "- PDFium source commit: $(git -C pdfium rev-parse HEAD)"
            echo "- Required LiteParse symbols: all 10 present"
            echo "- SHA256: $(sha256sum "$LIB" | awk '{print $1}')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PDFium build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-android-arm64-llamaparse
          path: |
            pdfium-binaries/staging/lib/libpdfium.so
            pdfium-binaries/pdfium-android-arm64.tgz
            pdfium-binaries/staging/args.gn
          if-no-files-found: error
          retention-days: 7
